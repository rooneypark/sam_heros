<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맵 메이커</title>
<style>
  :root {
    --bg: #0f1a24; --panel: #142230; --panel2: #1a2b3b; --line: #24394c; --text: #e6eef5; --dim: #8aa0b4;
    --accent: #2ee6b0; --accent-ink: #062a20; --enemy: #ff5a5a; --warn: #ffcc4d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on, button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  input, select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  #app { display: grid; grid-template-rows: 56px 1fr 34px; height: 100%; }
  header { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .title { font-size: 17px; font-weight: 800; margin-right: 10px; display: flex; align-items: center; gap: 8px; }
  header .title i { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); display: inline-block; }
  header .grow { flex: 1; }
  #mapName { width: 160px; }
  .runonly { display: none; } body.run .runonly { display: inline-flex; } body.run .editonly { display: none !important; }
  #runState { color: var(--accent); font-weight: 700; align-items: center; gap: 6px; }
  #runState::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  body.paused #runState { color: var(--warn); } body.paused #runState::before { background: var(--warn); }
  main { display: grid; grid-template-columns: 196px 1fr 250px; min-height: 0; }
  body.run main { grid-template-columns: 1fr !important; }
  @media (max-width: 1000px) {
    main { grid-template-columns: 150px 1fr 190px; }
    header button, header select, header input { padding: 4px 7px; } #mapName { width: 90px; } header .title { font-size: 14px; }
    .grid3 { grid-template-columns: repeat(2, 1fr); }
    #zoom { top: 54px; }
  }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; min-width: 0; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  body.run aside { display: none; }
  h3 { margin: 6px 2px 8px; font-size: 14px; display: flex; justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tile { aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--line); background-color: var(--panel2); cursor: pointer; position: relative; overflow: hidden; }
  .tile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px #2ee6b033; }
  .tile .rot { position: absolute; right: 2px; top: 2px; width: 20px; height: 20px; padding: 0; border-radius: 50%; font-size: 13px; line-height: 18px;
    background: #0f1a24dd; border: 1px solid var(--accent); color: var(--accent); z-index: 1; }
  .tile span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; text-align: center; background: #0009; padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pic { position: absolute; left: 4px; top: 4px; width: calc(100% - 8px); height: calc(100% - 18px); object-fit: contain; }
  .tabs { display: flex; gap: 4px; margin-bottom: 6px; } .tabs button { flex: 1; padding: 4px 0; font-size: 12px; }
  #unitSearch, .search { width: 100%; margin-bottom: 6px; }
  .tabs.games button { font-size: 12px; padding: 5px 2px; white-space: nowrap; }
  .tabs.wrap { flex-wrap: wrap; } .tabs.wrap button { flex: 1 0 30%; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  #center { position: relative; min-width: 0; min-height: 0; background: #000; overflow: hidden; }
  #gl, #ov { position: absolute; left: 0; top: 0; }
  #ov { pointer-events: none; }
  .float { position: absolute; top: 10px; display: flex; gap: 4px; background: #0f1a24e6; border: 1px solid var(--line); border-radius: 10px; padding: 4px; z-index: 2; }
  #tools { left: 10px; } #zoom { right: 10px; align-items: center; }
  #zoom b { min-width: 52px; text-align: center; }
  #brushSize { width: 56px; }
  #camBadge { position: absolute; right: 14px; bottom: 14px; z-index: 2; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--accent); background: #0f1a24e6; font-weight: 700; display: none; }
  body.run #camBadge { display: block; }
  .linkbtn { color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; text-decoration: none; }
  .linkbtn:hover { border-color: var(--accent); }
  #skillLog { position: absolute; left: 10px; top: 10px; z-index: 2; flex-direction: column; gap: 3px; pointer-events: none; font-size: 12px; }
  body.run #skillLog { display: flex; }
  #skillLog div { background: #0f1a24d0; border-radius: 6px; padding: 3px 8px; border-left: 3px solid var(--accent); }
  #skillLog div.enemy { border-left-color: var(--enemy); }
  #toast { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); background: #000c; border-radius: 8px; padding: 8px 14px; z-index: 3; display: none; }
  .portrait { height: 120px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); position: relative; margin-bottom: 6px; }
  .portrait .pic { left: 8px; top: 8px; width: calc(100% - 16px); height: calc(100% - 16px); }
  .uname { font-weight: 700; } .umeta { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.enemy.on { background: var(--enemy); color: #fff; border-color: var(--enemy); }
  .lv { display: grid; grid-template-columns: 38px 1fr 38px; gap: 6px; margin-bottom: 10px; }
  .lv input { text-align: center; width: 100%; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .card b { display: block; } .card small { color: var(--dim); display: block; }
  .card.locked { opacity: .5; }
  .card .tag { float: right; font-size: 11px; color: var(--accent); } .card.locked .tag { color: var(--dim); }
  .empty { color: var(--dim); padding: 20px 4px; text-align: center; }
  footer { display: flex; align-items: center; justify-content: center; gap: 18px; color: var(--dim); border-top: 1px solid var(--line); background: var(--panel); }
  footer { position: relative; } footer .r { position: absolute; right: 14px; }
  @media (max-width: 1000px) { footer .r { display: none !important; } }
  #debug { position: absolute; left: 8px; bottom: 6px; color: #7f9; font: 11px monospace; pointer-events: none; white-space: pre; z-index: 2; }
</style>
</head>
<body>
<div id="app">
  <header><a href="./maps.html" style="color:#6eeac1;margin:0 8px">전체 맵</a>
    <div class="title"><i></i>맵 메이커</div>
    <input id="mapName" class="editonly" value="새 맵" title="맵 이름">
    <select id="mapSize" class="editonly" title="새 맵 크기">
      <option value="8">8×8</option><option value="12" selected>12×12</option><option value="16">16×16</option><option value="24">24×24</option>
    </select>
    <button id="btnNew" class="editonly">새 맵</button>
    <div class="grow"></div>
    <span id="runState" class="runonly">실행 중</span>
    <a id="btnMotion" class="editonly linkbtn" href="./motion.html" target="_blank" title="시뮬레이션 없이 유닛별 동작 보기·비교 (새 창)">🎞 모션 체커</a>
    <button id="btnLoad" class="editonly">불러오기</button>
    <button id="btnSave" class="editonly">저장</button>
    <button id="btnRun" class="primary editonly">▶ 실행</button>
    <button id="btnPause" class="runonly">일시정지</button>
    <button id="btnEdit" class="runonly">■ 편집으로</button>
    <input id="file" type="file" accept=".json,.bytes" hidden>
  </header>
  <main>
    <aside>
      <h3>지형 <small id="terrainCount" style="color:var(--dim);font-weight:400"></small></h3>
      <div class="tabs wrap" id="terrainTabs"></div>
      <input id="terrainSearch" class="search" placeholder="타일 이름 검색 (예: obj_, br_22)">
      <div class="grid3" id="terrain"></div>
      <button id="moreTerrain" style="width:100%;margin-top:6px;display:none">더 보기</button>
      <hr>
      <h3>유닛 <small id="unitCount" style="color:var(--dim);font-weight:400"></small></h3>
      <div class="tabs games" id="gameTabs"></div>
      <div class="tabs" id="kindTabs"></div>
      <input id="unitSearch" placeholder="이름·키 검색">
      <div class="grid3" id="units"></div>
      <button id="moreUnits" style="width:100%;margin-top:6px;display:none">더 보기</button>
    </aside>
    <div id="center">
      <canvas id="gl"></canvas><canvas id="ov"></canvas>
      <div class="float editonly" id="tools">
        <button data-tool="select" class="on">선택</button>
        <button data-tool="draw">그리기</button>
        <button data-tool="erase">지우기</button>
        <select id="brushSize" title="붓 크기"><option value="1">1칸</option><option value="2">2칸</option><option value="3">3칸</option></select>
      </div>
      <div class="float editonly" id="zoom">
        <button id="zOut">−</button><b id="zPct">100%</b><button id="zIn">+</button><button id="zFit">전체 보기</button>
      </div>
      <div id="camBadge">🔒 게임 카메라 고정</div>
      <div id="skillLog" class="runonly" title="스킬 사용 기록"></div>
      <div id="toast"></div>
      <div id="debug"></div>
    </div>
    <aside class="right" id="inspector"></aside>
  </main>
  <footer>
    <span class="editonly">ⓘ 휠 확대·축소 · 가운데(또는 오른쪽) 버튼 화면 이동 · 클릭 배치 · Delete 선택 삭제</span>
    <span class="runonly">ⓘ 마우스로 부대 이동 · 공격과 스킬 자동 발동</span>
    <span class="runonly r">편집 복귀 시 배치·확대비율 복원</span>
  </footer>
</div>
<script type="module" src="./src/maker/maker.js"></script>
</body>
</html>
