<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모션 체커</title>
<style>
  :root {
    --bg: #0f1a24; --panel: #142230; --panel2: #1a2b3b; --line: #24394c; --text: #e6eef5; --dim: #8aa0b4;
    --accent: #2ee6b0; --accent-ink: #062a20; --enemy: #ff5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  input, select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  #app { display: grid; grid-template-rows: 52px 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .title { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  header .title i { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); display: inline-block; }
  header .grow { flex: 1; } header a { color: var(--dim); }
  #status { color: var(--dim); }
  h3 { margin: 6px 2px 8px; font-size: 14px; display: flex; justify-content: space-between; }
  h3 small { color: var(--dim); font-weight: 400; }
  .tabs { display: flex; gap: 4px; margin-bottom: 6px; } .tabs button { flex: 1; padding: 4px 0; font-size: 12px; }
  .tabs.games button { white-space: nowrap; }
  .search { width: 100%; margin-bottom: 6px; }
  .empty { color: var(--dim); padding: 20px 4px; text-align: center; }
  /* viewer (motion.js) */
  .motion-view { display: grid; grid-template-columns: 230px 1fr; min-height: 0; }
  .mv-side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; min-width: 0; }
  .mv-list { display: flex; flex-direction: column; gap: 3px; }
  .mv-list button { text-align: left; padding: 5px 8px; } .mv-list small { color: var(--dim); }
  .mv-main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .mv-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .mv-bar .tabs { margin: 0; flex: 0 1 auto; flex-wrap: wrap; } .mv-bar .tabs button { flex: 0 0 auto; padding: 5px 10px; }
  .mv-chk { color: var(--dim); display: flex; gap: 4px; align-items: center; }
  .mv-grid { overflow: auto; padding: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .mv-cell { position: relative; background: var(--panel2); border: 2px solid var(--line); border-radius: 12px; padding: 6px; width: 236px; }
  .mv-cell.hit { border-color: var(--enemy); box-shadow: 0 0 0 2px #ff5a5a55; }
  .mv-cell canvas { display: block; width: 220px; height: 220px; background: #24384a; border-radius: 8px; }
  .mv-name { font-weight: 700; margin-top: 4px; } .mv-name small { color: var(--dim); font-weight: 400; }
  .mv-info { color: var(--dim); font-size: 11px; min-height: 30px; }
  .mv-x { position: absolute; right: 8px; top: 8px; padding: 0 7px; }
  .mv-warn { color: #ffb14d; font-size: 11px; }
  .mv-cell.warned:not(.hit) { border-color: #8a6a2a; }
  .mv-hint { color: var(--dim); font-size: 12px; padding: 6px 10px; border-top: 1px solid var(--line); }
  .mv-main { grid-template-rows: auto auto 1fr auto !important; }
  .mv-stage { display: none; border-bottom: 1px solid var(--line); background: #24384a; }
  .motion-view.fx .mv-stage { display: block; }
  .mv-stage canvas { display: block; width: 100%; height: 300px; }
  #boot { display: none; }
  .mv-stage #boot { display: block; }
</style>
</head>
<body>
<div id="app">
  <header><a href="./maps.html" style="color:#6eeac1;margin:0 8px">전체 맵</a>
    <div class="title"><i></i>모션 체커</div>
    <span id="status">불러오는 중…</span>
    <div class="grow"></div>
    <a href="./maker.html?samgukMap=character_review" target="_blank">맵 메이커 열기</a>
  </header>
  <div id="motionView" class="motion-view"></div>
</div>
<canvas id="boot" width="2" height="2"></canvas>
<script type="module" src="./src/maker/motion_checker.js"></script>
</body>
</html>
