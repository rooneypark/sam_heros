<!doctype html><html lang="ko"><meta charset="utf-8"><title>세 장수 숨쉬기 최종본</title><style>body{margin:24px;background:#202426;color:#eee;font:16px system-ui}section{display:flex;flex-wrap:wrap}figure{margin:0}img{width:400px;height:440px}button,input{margin:12px}a{color:#9ee8cf}</style><h1>4프레임 숨쉬기 · 최종 승인본</h1><p>하반신 고정 · 관우/장비 무기와 쥔 손 고정 · 상체 0 → -2 → -4 → -2px</p><button id="toggle">일시정지</button><label>프레임 <input id="slider" type="range" min="0" max="3" value="0"></label><span id="status"></span><section id="heroes"></section><p><a href="visuals/idle-breathing-12-frames.png">전체 12프레임 펼치기</a></p><script>const names=['liu-bei','guan-yu','zhang-fei'],labels=['유비','관우','장비'];heroes.innerHTML=names.map((n,i)=>`<figure><figcaption>${labels[i]}</figcaption><img id="hero${i}"></figure>`).join('');let frame=0,playing=true;const sources=names.map(n=>Array.from({length:4},(_,i)=>{let im=new Image();im.src=`../../${n}/idle/frame-0${i+1}.png`;return im}));function draw(){names.forEach((n,i)=>document.getElementById('hero'+i).src=sources[i][frame].src);slider.value=frame;status.textContent=`${frame+1}/4 · 300ms`;};toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'일시정지':'재생'};slider.oninput=()=>{playing=false;toggle.textContent='재생';frame=+slider.value;draw()};setInterval(()=>{if(playing){frame=(frame+1)%4;draw()}},300);draw();</script></html>
