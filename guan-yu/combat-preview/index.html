<!doctype html><html lang="ko"><meta charset="utf-8"><title>관우 공격 모션 검토본</title><style>body{background:#202426;color:#eee;margin:24px;font:16px system-ui}section{display:flex;flex-wrap:wrap}article{width:480px}img{width:480px;height:450px}h2{font-size:19px}button,select,input{margin:8px;padding:8px}a{color:#99ddc6}small{color:#bbb}</style><h1>관우 · 공격/스킬 8프레임 검토본</h1><p>오른쪽 아래 대각 · 준비 → 발동 자세 → 복귀</p><button id="play">일시정지</button><select id="speed"><option value="160">동작 비교</option><option value="300">느리게</option><option value="100">빠르게</option></select><input id="frame" type="range" min="0" max="7" value="0"><span id="counter"></span><section id="items"></section><p><a href="all-24-frames.png">24프레임 전체 펼치기</a></p><small>사용자 지정 동작으로 제작한 승인 전 검토본입니다. 원작 스킬 분석 결과나 타격 판정 구현이 아닙니다. 실제 개별 재생 시간은 각 animation.json 참조.</small><script>const names=['basic-attack','skill-1','skill-2'],labels=['기본 공격 · 대각 베기 · 잔상','스킬 1 · 두 번 대각 베기 · X 잔상','스킬 2 · 크게 내려찍기 · 큰 잔상'];items.innerHTML=names.map((n,i)=>`<article><h2>${labels[i]}</h2><img id="im${i}"><a href="../${n}/frames-overview.png">8프레임 보기</a> · <a href="../${n}/preview.gif">개별 GIF</a></article>`).join('');let f=0,running=true,last=0;const imgs=names.map(n=>Array.from({length:8},(_,i)=>{const im=new Image;im.src=`../${n}/frame-0${i+1}.png`;return im}));function draw(){names.forEach((_,i)=>document.getElementById('im'+i).src=imgs[i][f].src);frame.value=f;counter.textContent=`${f+1}/8`};play.onclick=()=>{running=!running;play.textContent=running?'일시정지':'재생'};frame.oninput=()=>{running=false;play.textContent='재생';f=+frame.value;draw()};function tick(t){if(running&&t-last>=+speed.value){f=(f+1)%8;draw();last=t}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);</script></html>
