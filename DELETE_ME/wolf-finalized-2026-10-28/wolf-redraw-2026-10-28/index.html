<!doctype html><html lang="ko"><meta charset="utf-8"><title>황건적 늑대 재작업 검토</title>
<style>body{background:#20282e;color:#edf3f5;font:16px system-ui;margin:12px}button,select{padding:8px;margin:4px}section{display:flex;flex-wrap:wrap;gap:8px}article{background:#e5edf0;color:#26343c;border-radius:12px;padding:8px}h2{font-size:16px}canvas{width:180px;height:150px}img{max-width:100%}small{color:#b4c4cd}</style>
<h1>황건적 늑대 · 새 검토본</h1><p>350×350 투명 PNG · 기존 대비 약 10~15% 축소 · 기존 승인본 보존</p>
<button id="pause">일시정지</button><button id="next">다음 프레임</button><select id="speed"><option value="1">정상 속도</option><option value="0.33">느린 속도</option></select><select id="bg"><option value="#e5edf0">밝은 배경</option><option value="#283138">어두운 배경</option><option value="#7ba366">초록 배경</option></select><section id="clips"></section><h2>18프레임 펼치기</h2><img src="all-frames.png"><p><small>생성 프레임의 해부학적 치수 불변성이 완전히 증명된 것은 아닙니다. 사용자 검토 후 교체합니다.</small></p>
<script>
const clips=[], names={'idle':'숨쉬기 4프레임','run':'이동 6프레임','basic-attack':'물기 8프레임'};let playing=true,time=0,last=0;
Promise.all(Object.entries(names).map(async([key,name])=>{const m=await fetch(key+'/animation.json').then(r=>r.json());const images=await Promise.all(m.frames.map(f=>new Promise(resolve=>{const i=new Image;i.onload=()=>resolve(i);i.src=key+'/'+f})));const a=document.createElement('article');a.innerHTML='<h2>'+name+'</h2><canvas width="180" height="150"></canvas><div></div>';document.querySelector('#clips').append(a);clips.push({m,images,c:a.querySelector('canvas').getContext('2d'),label:a.querySelector('div'),index:0})})).then(()=>requestAnimationFrame(tick));
function tick(t){if(last&&playing)time+=(t-last)*Number(document.querySelector('#speed').value);last=t;for(const q of clips){if(playing){let n=time%q.m.durations_ms.reduce((a,b)=>a+b,0),i=0;while(n>=q.m.durations_ms[i])n-=q.m.durations_ms[i++];q.index=i}q.c.fillStyle=document.querySelector('#bg').value;q.c.fillRect(0,0,180,150);q.c.drawImage(q.images[q.index],90,130,170,140,5,5,170,140);q.label.textContent=(q.index+1)+' / '+q.images.length}requestAnimationFrame(tick)}
document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'일시정지':'재생'};
document.querySelector('#next').onclick=()=>{playing=false;document.querySelector('#pause').textContent='재생';for(const q of clips)q.index=(q.index+1)%q.images.length};
</script></html>
