<!doctype html><html lang="ko"><meta charset="utf-8"><title>유관장 모션 재작업 검토</title>
<style>*{box-sizing:border-box}body{margin:0;background:#18232a;color:#edf5f7;font:15px system-ui}header{position:sticky;top:0;background:#18232af5;padding:20px;z-index:3;border-bottom:1px solid #455761}h1{font-size:22px;margin:0 0 8px}button,select,label{margin-right:12px}button,select{padding:8px;background:#344b58;color:white;border:1px solid #69808d;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;padding:20px}article{background:#263640;border:1px solid #455761;border-radius:10px;padding:12px}h2{font-size:17px;margin:2px 0}canvas{display:block;width:350px;height:350px;max-width:100%;background:#dfe9ed;margin:auto}p{color:#bfd0d9}a{color:#91e0d2;margin-right:15px}.count{font-variant-numeric:tabular-nums}footer{padding:20px}</style>
<header><h1>유비 · 관우 · 장비 — 새 모션 검토본</h1><p>오전 폐기본 제외 · 승인 원본 보존 · 350×350 · 아직 최종 승인 전</p><button id="play">일시정지</button><button id="step">다음 프레임</button><select id="speed"><option value="1">정상 속도</option><option value="0.4">느리게</option></select><label><input id="overlay" type="checkbox">원본 겹쳐 보기</label><label><input id="trans" type="checkbox" checked>기본 → 동작 → 기본</label><select id="bg"><option value="#dfe9ed">밝은 배경</option><option value="#263640">어두운 배경</option></select></header><main id="cards"></main><footer><a href="all-frames.png">전체 프레임 펼치기</a><a href="README.md">작업 및 검수 기록</a></footer>
<script>
const jobs=[['zhang-fei','장비','basic-attack','찌르기',8],['zhang-fei','장비','skill-1','크게 휘두르기',8],['zhang-fei','장비','skill-2','포효 · 방어 버프',8],['guan-yu','관우','basic-attack','한 번 베기',8],['guan-yu','관우','skill-1','크게 들어 내려 베기',8],['guan-yu','관우','skill-2','한 손 들기 · 공격 버프',8],['liu-bei','유비','skill-1','단일 치유',8],['liu-bei','유비','skill-2','전체 치유',8],['guan-yu','관우','run','칼날 방향 교정',6]];
const TIMES={"guan-yu/basic-attack": [180, 120, 120, 90, 150, 120, 150, 240], "guan-yu/run": [100, 100, 100, 100, 100, 100], "guan-yu/skill-1": [180, 120, 120, 90, 150, 120, 150, 240], "guan-yu/skill-2": [180, 120, 120, 90, 150, 120, 150, 240], "liu-bei/skill-1": [180, 110, 90, 70, 140, 100, 110, 180], "liu-bei/skill-2": [180, 100, 100, 90, 150, 120, 120, 180], "zhang-fei/basic-attack": [180, 120, 120, 90, 150, 120, 150, 240], "zhang-fei/skill-1": [180, 120, 120, 90, 150, 120, 150, 240], "zhang-fei/skill-2": [180, 120, 120, 90, 150, 120, 150, 240]};const cards=[],load=src=>new Promise((ok,no)=>{const im=new Image;im.onload=()=>ok(im);im.onerror=no;im.src=src});let playing=true,time=0,last=0,manual=0;
Promise.all(jobs.map(async([hero,name,motion,title,n])=>{const d=`${hero}/${motion}`,el=document.createElement('article');el.innerHTML=`<h2>${name} · ${title}</h2><p class="count">로딩 중</p><canvas width="350" height="350"></canvas><p><a href="${d}/preview.gif">GIF</a><a href="${d}/preview-slow.gif">느린 GIF</a><a href="${d}/frames-overview.png">프레임 시트</a></p>`;document.querySelector('#cards').append(el);const original=await load(`../${hero}/original/original.png`),frames=await Promise.all(Array.from({length:n},(_,i)=>load(`${d}/frame-${String(i+1).padStart(2,'0')}.png`)));cards.push({times:TIMES[d],el,c:el.querySelector('canvas').getContext('2d'),original,frames,n});})).then(()=>document.body.dataset.loaded='true');
function render(t){if(playing)time+=(t-last||0)*Number(document.querySelector('#speed').value);last=t;for(const o of cards){let transition=document.querySelector('#trans').checked,seq=transition?[o.original,...o.frames,o.original]:o.frames;let spans=transition?[400,...o.times,400]:o.times;let position=time%spans.reduce((a,b)=>a+b,0),index=0;if(playing){while(index<spans.length-1&&position>=spans[index]){position-=spans[index];index++;}}else index=manual%seq.length;const c=o.c;c.fillStyle=document.querySelector('#bg').value;c.fillRect(0,0,350,350);c.strokeStyle='#8fa4ae';c.beginPath();c.moveTo(100,245.5);c.lineTo(250,245.5);c.stroke();if(document.querySelector('#overlay').checked){c.globalAlpha=.25;c.drawImage(o.original,0,0);c.globalAlpha=1}c.drawImage(seq[index],0,0);o.el.querySelector('.count').textContent=transition&&(index===0||index===seq.length-1)?'기본자세':`프레임 ${transition?index:index+1} / ${o.n}`;}requestAnimationFrame(render)}requestAnimationFrame(render);
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시정지':'재생'};document.querySelector('#step').onclick=()=>{playing=false;manual++;document.querySelector('#play').textContent='재생'};
</script></html>
